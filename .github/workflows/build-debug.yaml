name: Validate Personal ARM64 Build
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.11'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          patch --batch -p 1 < "$GITHUB_WORKSPACE/.github/patch/disable_pidfd_on_android.patch"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Configure personal package
        run: |
          printf '%s\n' 'custom.application.id=io.kairyo.cmfa.hardened' 'remove.suffix=true' > local.properties

      - name: Build
        if: success()
        run: ./gradlew --no-daemon app:assembleMetaRelease
          
      # This validation APK uses Gradle's debug key, not the personal update key.
      - name: Upload ARM64 validation APK
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: cmfa-hardened-arm64-validation-debug-key
          path: app/build/outputs/apk/meta/release/*.apk
          if-no-files-found: error
          retention-days: 7
